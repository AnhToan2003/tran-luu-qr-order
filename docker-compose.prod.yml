# P0 SECURITY FIX:
# - MongoDB and Redis are NO LONGER published to the host network
# - All services communicate only via the internal Docker network
# - MongoDB requires authentication (MONGO_INITDB_ROOT_USERNAME/PASSWORD)
# - Redis requires password (REDIS_PASSWORD env → requirepass)
# - App container has healthcheck and graceful shutdown
# Use environment variables / Docker secrets for all credentials.
# NEVER hardcode credentials — use .env.production or Docker secrets.

networks:
  internal:
    driver: bridge
    internal: true   # no external connectivity from this network
  proxy:
    driver: bridge   # only the app is exposed via this network

secrets:
  mongo_keyfile:
    file: ./docker/secrets/mongo-keyfile

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tran_luu_app
    restart: always
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"   # Public traffic must terminate TLS at a reverse proxy
    networks:
      - internal
      - proxy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Credentials are injected — never hardcode in compose file
      - MONGO_URI=mongodb://${MONGO_APP_USER:?MONGO_APP_USER is required}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/${DB_NAME:-tran_luu_qr_order}?authSource=${DB_NAME:-tran_luu_qr_order}&replicaSet=rs0
      - DB_NAME=${DB_NAME:-tran_luu_qr_order}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Only trust the internal proxy (Nginx/Traefik) CIDR — adjust to your actual proxy IP
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.0.0.0/8}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  mongodb:
    image: mongo:7-jammy
    container_name: tran_luu_mongodb
    restart: always
    # P0 SECURITY FIX: NO port binding — only accessible via internal Docker network
    # ports: INTENTIONALLY REMOVED — do not restore without VPN/SSH tunnel
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
      --keyFile /run/secrets/mongo-keyfile
    networks:
      - internal
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      - MONGO_INITDB_DATABASE=admin
      - MONGO_APP_USER=${MONGO_APP_USER:?MONGO_APP_USER is required}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      - DB_NAME=${DB_NAME:-tran_luu_qr_order}
    volumes:
      - mongodb_prod_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    secrets:
      - source: mongo_keyfile
        target: mongo-keyfile
        mode: 0400
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status().ok } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }" | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tran_luu_redis
    restart: always
    # P0 SECURITY FIX: NO port binding — only accessible via internal Docker network
    # ports: INTENTIONALLY REMOVED — do not restore without VPN/SSH tunnel
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode yes
    networks:
      - internal
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional: Nginx reverse proxy (uncomment if not using an external load balancer)
  # nginx:
  #   image: nginx:alpine
  #   networks:
  #     - proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  mongodb_prod_data:
  redis_prod_data:
