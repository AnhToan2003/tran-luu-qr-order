# Local Docker smoke/integration environment.
# This file is intentionally separate from docker-compose.prod.yml so local
# credentials and localhost origins can never be mistaken for production.

name: tran-luu-local

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    driver: bridge

secrets:
  mongo_keyfile:
    file: ./docker/secrets/mongo-keyfile

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tran_luu_app_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-3101}:3001"
    networks:
      - internal
      - proxy
    env_file:
      - .env.docker.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      MONGO_URI: mongodb://${MONGO_APP_USER:?MONGO_APP_USER is required}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/${DB_NAME:-tran_luu_qr_order}?authSource=${DB_NAME:-tran_luu_qr_order}&replicaSet=rs0
      DB_NAME: ${DB_NAME:-tran_luu_qr_order}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.0.0.0/8}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  mongodb:
    build:
      context: ./docker/mongo-local
      dockerfile: Dockerfile
    image: tran-luu-mongo-local:7
    container_name: tran_luu_mongodb_local
    restart: unless-stopped
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
    networks:
      - internal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: admin
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      DB_NAME: ${DB_NAME:-tran_luu_qr_order}
    volumes:
      - mongodb_local_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    secrets:
      - source: mongo_keyfile
        target: mongo-keyfile
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status().ok } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tran_luu_redis_local
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode yes
    networks:
      - internal
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongodb_local_data:
  redis_local_data:
