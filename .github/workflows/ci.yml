name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Frontend + Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test API with isolated MongoDB replica set and build FE/BE
        run: npm run build:ci

      - name: Verify build artifacts
        run: |
          test -f dist/index.html && echo "Frontend index.html OK"
          test -f dist-server/index.js && echo "Compiled server entrypoint OK"
          echo "All artifacts verified successfully!"
