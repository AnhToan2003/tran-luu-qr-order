name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Frontend + Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (React + Vite)
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html && echo "Frontend index.html OK"
          test -f server/index.ts && echo "Server entrypoint OK"
          echo "All artifacts verified successfully!"
