name: CI — Build, Lint, Test & Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run npm security audit
        run: npm audit --audit-level moderate

  typecheck-lint:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: TypeScript server typecheck
        run: npx tsc --noEmit -p tsconfig.server.json
      - name: TypeScript backup tools typecheck
        run: npm run typecheck:tools
      - name: ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  frontend-tests:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run browser-like component tests
        run: npm run test:frontend

  integration-tests:
    name: Integration Tests (Replica Set + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run full test suite with coverage gate
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: |
            test-results/
            coverage/

  build:
    name: Build Frontend + Server
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build frontend and server
        run: npm run build
      - name: Verify build artifacts
        run: |
          test -f dist/index.html && echo "Frontend index.html OK"
          test -f dist-server/index.js && echo "Compiled server entrypoint OK"
          echo "All artifacts verified successfully!"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            dist-server/

  db-integrity-check:
    name: Database Integrity Audit
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Seed isolated audit fixture
        run: npm run seed
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017
          DB_NAME: tran_luu_qr_order_ci
      - name: Run DB integrity audit (CI mode — fails on critical issues)
        run: npx tsx scripts/audit-db-integrity.ts --ci
        env:
          CI: true
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017
          DB_NAME: tran_luu_qr_order_ci

  backup-disaster-recovery-drill:
    name: Backup & Disaster Recovery Drill
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Seed database fixture
        run: npm run seed
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/tran_luu_qr_order
          DB_NAME: tran_luu_qr_order
      - name: Run automated backup dump
        run: npm run backup:dump
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/tran_luu_qr_order
          DB_NAME: tran_luu_qr_order
          BACKUP_ENCRYPTION_KEY: ci-test-backup-key-32characters!
      - name: Run disaster recovery restore drill
        run: npm run backup:restore:drill
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/tran_luu_qr_order
          DB_NAME: tran_luu_qr_order
          BACKUP_ENCRYPTION_KEY: ci-test-backup-key-32characters!

  docker-compose-validate:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Generate production secrets
        run: npm run generate:secrets
      - name: Validate Docker Compose production configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-audit, typecheck-lint, unit-tests, frontend-tests, integration-tests, build, db-integrity-check, backup-disaster-recovery-drill, docker-compose-validate]
    steps:
      - run: echo "All CI checks passed successfully!"
