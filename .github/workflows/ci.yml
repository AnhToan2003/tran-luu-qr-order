name: CI — Build, Lint, Test & Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run npm security audit
        run: npm audit --audit-level moderate

  typecheck-lint:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: TypeScript server typecheck
        run: npx tsc --noEmit -p tsconfig.server.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/

  integration-tests:
    name: Integration Tests (Replica Set + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests (uses mongodb-memory-server replica set)
        run: npm run test:integration
        env:
          CI: true
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: true
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: test-results/

  build:
    name: Build Frontend + Server
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build frontend and server
        run: npm run build
      - name: Verify build artifacts
        run: |
          test -f dist/index.html && echo "Frontend index.html OK"
          test -f dist-server/index.js && echo "Compiled server entrypoint OK"
          echo "All artifacts verified successfully!"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            dist-server/

  db-integrity-check:
    name: Database Integrity Audit
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run DB integrity audit (CI mode — fails on critical issues)
        run: npx tsx scripts/audit-db-integrity.ts --ci
        env:
          CI: true
          # In CI, uses default local DB — integration tests populate it
          NODE_ENV: test

  all-checks-passed:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-audit, typecheck-lint, unit-tests, integration-tests, build]
    steps:
      - run: echo "All CI checks passed successfully!"
